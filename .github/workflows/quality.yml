name: Plugin quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['7.4', '8.1', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Lint PHP
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate JavaScript and map data
        run: |
          node --check assets/reviewerCertificateTab.js
          node --check assets/reviewerCertificateQr.js
          node --check assets/reviewerInsights.js
          jq -e '.type == "FeatureCollection" and (.features | length > 150)' assets/world-110m.json
      - name: Validate plugin metadata
        run: |
          php -r '$xml = simplexml_load_file("version.xml"); if (!$xml || (string) $xml->release !== "1.9.1.0") { exit(1); }'
